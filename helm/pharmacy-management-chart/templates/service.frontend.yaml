apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}-svc
spec:
  selector:
    app: {{ .Values.frontend.name }}
  ports:
    - name: {{ .Values.frontend.name }}-port
      protocol: TCP
      port: {{ .Values.frontend.servicePort }}
      targetPort: {{ .Values.frontend.port }}
  type: ClusterIP
