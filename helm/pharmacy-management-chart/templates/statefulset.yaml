---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db-statefulset
  labels:
    app: postgres-db
spec:
  selector:
    matchLabels: 
      app: postgres-db
  replicas: {{ .Values.db.replicas }}
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres-db
          image: {{ .Values.db.image }}
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.username }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.password }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.db.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.db.storage }}

---